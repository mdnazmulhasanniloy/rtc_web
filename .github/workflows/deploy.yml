name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check and build
        run: npm run typecheck && npm run build

      - name: Validate Docker Compose
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production config --quiet

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Package release
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='dist' \
            --exclude='.env' \
            --exclude='.env.production' \
            -czf /tmp/relay-release.tgz .

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: scp -i ~/.ssh/deploy_key /tmp/relay-release.tgz "$VPS_USER@$VPS_HOST:relay-release.tgz"

      - name: Deploy containers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" <<'REMOTE'
          set -eu
          mkdir -p relay-chat
          tar -xzf relay-release.tgz -C relay-chat
          rm relay-release.tgz
          cd relay-chat
          test -f .env.production || { echo '.env.production is missing on the VPS'; exit 1; }
          docker compose --env-file .env.production up -d --build --remove-orphans
          docker compose --env-file .env.production ps
          REMOTE

      - name: Verify production health
        run: curl --fail --retry 12 --retry-delay 5 --retry-all-errors https://chat.nazmulhasan.dev/health


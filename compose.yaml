services:
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: https://chat.nazmulhasan.dev
    restart: unless-stopped
    init: true
    expose:
      - "3000"

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/relay.db
      WEB_ORIGIN: https://chat.nazmulhasan.dev
      TURN_HOST: turn.chat.nazmulhasan.dev
      PORT: "4000"
    volumes:
      - relay_data:/data
    expose:
      - "4000"

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    command: /bin/sh -c 'while :; do sleep 6h; nginx -s reload; done & nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh
    command: -c 'while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done'

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    command:
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in .env.production}
      - --realm=turn.chat.nazmulhasan.dev
      - --server-name=turn.chat.nazmulhasan.dev
      - --external-ip=172.252.13.8
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-multicast-peers
      - --no-cli
      - --no-tls
      - --no-dtls

volumes:
  relay_data:
  letsencrypt:
  certbot_www:
